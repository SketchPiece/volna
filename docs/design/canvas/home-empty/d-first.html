<style>.wavy{margin-top:26px;margin-bottom:26px;filter:drop-shadow(0 1px 3px rgba(142,36,21,.35));animation:dip 2.35s infinite}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

<style>
.ghost .item .k,.ghost .item .t{color:transparent;border-radius:4px}
.ghost .item .k{width:118px;height:9px;margin:4px 0 8px;background:rgba(38,33,29,.07)}
.ghost .item .t{height:11px;background:rgba(38,33,29,.06)}
.say .item .t{font-weight:500}
.say .item .t::before{content:"«";color:var(--ink-2)} .say .item .t::after{content:"»";color:var(--ink-2)}

<script src="_shared.js"></script>
<script>
// Antenna mast with lamp waves: not the logo, so the mark still appears only on air.
const mast = `<svg width="156" height="156" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M22 57 L32 31 L42 57" stroke="#26211D" stroke-width="2.6"/><path d="M27 44 H37 M27 44 L42 57 M37 44 L22 57" stroke="#26211D" stroke-width="1.8"/>
  <circle cx="32" cy="26" r="4.2" fill="#E8A33D" style="filter:drop-shadow(0 0 4px rgba(232,163,61,.9))"/>
  <path class="w1" d="M22 16 a14 14 0 0 0 0 20 M42 16 a14 14 0 0 1 0 20" stroke="#E8A33D" stroke-width="2.4"/>
  <path class="w2" d="M15 9 a24 24 0 0 0 0 34 M49 9 a24 24 0 0 1 0 34" stroke="#E8A33D" stroke-width="2.4"/>
</svg>`;
Volna.idle({ stage: `<div class="hero">
  <div class="badge">${mast}</div>
  <h2>Первый выход в эфир</h2>
  <p>Позвони и спроси что угодно.</p>
  <svg class="wavy" width="36" height="84" viewBox="0 0 36 84" fill="none" stroke="#B8321F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFC6B6"/><stop offset="1" stop-color="#E8A33D"/></linearGradient></defs>
    <path d="${(() => { let d = 'M18 0'; for (let i = 1; i <= 40; i++) { const t = i / 40; d += ' L' + (18 + 7 * (1 - t) * Math.sin(t * Math.PI * 5)).toFixed(2) + ' ' + (t * 73).toFixed(2); } return d + ' L18 81 M6 68 L18 81 L30 68'; })()}"/>
  </svg>
</div>` });
</script>
