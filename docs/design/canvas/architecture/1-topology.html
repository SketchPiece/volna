<header><div><h1>Волна: кто с кем говорит</h1>
<p class="lede">Звонок идёт мимо ядра: ядро только открывает сессию и работает рядом с ней. Всё, что требует ключей и времени, живёт на Mac.</p></div>
<div class="legend"><span><i class="audio"></i>звук</span><span><i></i>запрос</span><span><i class="hold"></i>держится весь звонок</span></div></header>
