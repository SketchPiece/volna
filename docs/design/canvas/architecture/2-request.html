<header><div><h1>Путь одной просьбы</h1>
<p class="lede">Голосовая модель только разговаривает. Думает и действует ядро: само решает, какой набор и какая модель нужны, а инструменты телефона отдаёт приложению.</p></div>
<div class="legend"><span><i class="audio"></i>голос</span><span><i></i>запрос</span><span><i class="hold"></i>через очередь или сокет</span></div></header>
<figure><svg viewBox="0 0 1504 985" role="img" aria-label="Просьба голосом доходит до GPT-Live, модель делегирует ядру, ядро спрашивает Jev о наборе и классе, зовёт модель класса, исполняет инструмент на телефоне через очередь и возвращает текст в сессию."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#26211D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8321F"/></marker></defs><line class="life" x1="70" y1="66" x2="70" y2="975"/><rect class="zone" x="-20.0" y="0" width="180" height="66" rx="16"/><text class="t-cell" x="70" y="28" text-anchor="middle">Владелец</text><text class="t-small" x="70" y="50" text-anchor="middle">голос</text><line class="life" x1="270" y1="66" x2="270" y2="975"/><rect class="zone" x="180.0" y="0" width="180" height="66" rx="16"/><text class="t-cell" x="270" y="28" text-anchor="middle">iPhone</text><text class="t-small" x="270" y="50" text-anchor="middle">приложение</text><line class="life" x1="480" y1="66" x2="480" y2="975"/><rect class="zone dark" x="390.0" y="0" width="180" height="66" rx="16"/><text class="t-cell lamp" x="480" y="28" text-anchor="middle">GPT-Live</text><text class="t-small dark-s" x="480" y="50" text-anchor="middle">голосовая модель</text><line class="life" x1="720" y1="66" x2="720" y2="975"/><rect class="zone" x="630.0" y="0" width="180" height="66" rx="16"/><text class="t-cell" x="720" y="28" text-anchor="middle">Ядро</text><text class="t-small" x="720" y="50" text-anchor="middle">ClientDelegate</text><line class="life" x1="950" y1="66" x2="950" y2="975"/><rect class="zone" x="860.0" y="0" width="180" height="66" rx="16"/><text class="t-cell" x="950" y="28" text-anchor="middle">Jev</text><text class="t-small" x="950" y="50" text-anchor="middle">TypeSafe</text><line class="life" x1="1150" y1="66" x2="1150" y2="975"/><rect class="zone" x="1060.0" y="0" width="180" height="66" rx="16"/><text class="t-cell" x="1150" y="28" text-anchor="middle">Модель класса</text><text class="t-small" x="1150" y="50" text-anchor="middle">Flash Lite · Sonnet 5</text><circle class="num" cx="18" cy="120" r="13"/><text class="num-t" x="18" y="125" text-anchor="middle">1</text><line class="e  audio" x1="70" y1="120" x2="474" y2="120" marker-end="url(#ar)"/><text class="t-audio" x="275.0" y="110" text-anchor="middle">«напомни завтра купить хлеб»</text><circle class="num" cx="18" cy="180" r="13"/><text class="num-t" x="18" y="185" text-anchor="middle">2</text><line class="e hold" x1="480" y1="180" x2="714" y2="180" marker-end="url(#a)"/><text class="t-edge mono" x="600.0" y="170" text-anchor="middle">delegation.created</text><circle class="num" cx="18" cy="245" r="13"/><text class="num-t" x="18" y="250" text-anchor="middle">3</text><rect class="cell" x="635" y="220" width="170" height="50" rx="12"/><text class="t-edge" x="720" y="251" text-anchor="middle">хвост ≤ 400 мс</text><circle class="num" cx="18" cy="320" r="13"/><text class="num-t" x="18" y="325" text-anchor="middle">4</text><line class="e " x1="720" y1="320" x2="944" y2="320" marker-end="url(#a)"/><text class="t-edge" x="835.0" y="310" text-anchor="middle">tool · pack · tier?</text><circle class="num" cx="18" cy="375" r="13"/><text class="num-t" x="18" y="380" text-anchor="middle">5</text><line class="e " x1="950" y1="375" x2="726" y2="375" marker-end="url(#a)"/><text class="t-edge" x="835.0" y="365" text-anchor="middle">reminders, simple · ≤ 800 мс</text><circle class="num" cx="18" cy="445" r="13"/><text class="num-t" x="18" y="450" text-anchor="middle">6</text><line class="e " x1="720" y1="445" x2="1144" y2="445" marker-end="url(#a)"/><text class="t-edge" x="935.0" y="435" text-anchor="middle">реплики + инструменты набора</text><circle class="num" cx="18" cy="505" r="13"/><text class="num-t" x="18" y="510" text-anchor="middle">7</text><line class="e " x1="1150" y1="505" x2="726" y2="505" marker-end="url(#a)"/><text class="t-edge mono" x="935.0" y="495" text-anchor="middle">create_reminder(…)</text><circle class="num" cx="18" cy="570" r="13"/><text class="num-t" x="18" y="575" text-anchor="middle">8</text><line class="e hold" x1="720" y1="570" x2="276" y2="570" marker-end="url(#a)"/><text class="t-edge" x="495.0" y="560" text-anchor="middle">в очередь → долгий опрос</text><circle class="num" cx="18" cy="630" r="13"/><text class="num-t" x="18" y="635" text-anchor="middle">9</text><rect class="cell" x="185" y="605" width="170" height="50" rx="12"/><text class="t-edge" x="270" y="636" text-anchor="middle">EventKit</text><circle class="num" cx="18" cy="715" r="13"/><text class="num-t" x="18" y="720" text-anchor="middle">10</text><line class="e " x1="270" y1="715" x2="714" y2="715" marker-end="url(#a)"/><text class="t-edge mono" x="495.0" y="705" text-anchor="middle">POST /device-tools/:id</text><circle class="num" cx="18" cy="775" r="13"/><text class="num-t" x="18" y="780" text-anchor="middle">11</text><line class="e " x1="720" y1="775" x2="1144" y2="775" marker-end="url(#a)"/><text class="t-edge" x="935.0" y="765" text-anchor="middle">результат</text><circle class="num" cx="18" cy="830" r="13"/><text class="num-t" x="18" y="835" text-anchor="middle">12</text><line class="e " x1="1150" y1="830" x2="726" y2="830" marker-end="url(#a)"/><text class="t-edge" x="935.0" y="820" text-anchor="middle">текст ответа</text><circle class="num" cx="18" cy="890" r="13"/><text class="num-t" x="18" y="895" text-anchor="middle">13</text><line class="e " x1="720" y1="890" x2="486" y2="890" marker-end="url(#a)"/><text class="t-edge mono" x="600.0" y="880" text-anchor="middle">commentary.append</text><circle class="num" cx="18" cy="950" r="13"/><text class="num-t" x="18" y="955" text-anchor="middle">14</text><line class="e  audio" x1="480" y1="950" x2="76" y2="950" marker-end="url(#ar)"/><text class="t-audio" x="275.0" y="940" text-anchor="middle">«Напомню завтра в девять»</text><rect class="note" x="1250" y="150" width="254" height="68" rx="12"/><text class="t-small" x="1266" y="180">Live не пишет, что нужно:</text><text class="t-small" x="1266" y="202">ядро читает стенограмму само</text><rect class="note" x="1250" y="224" width="254" height="68" rx="12"/><text class="t-small" x="1266" y="254">Консоль :25452 может</text><text class="t-small" x="1266" y="276">ответить вместо автомата</text><rect class="note" x="1250" y="310" width="254" height="90" rx="12"/><text class="t-small" x="1266" y="340">Jev уверен в быстром</text><text class="t-small" x="1266" y="362">инструменте: ядро отвечает</text><text class="t-small" x="1266" y="384">само, шаги 6–12 не нужны</text><rect class="note" x="1250" y="545" width="254" height="68" rx="12"/><text class="t-small" x="1266" y="575">Не забран за 15 с →</text><text class="t-small" x="1266" y="597">device_unavailable</text><rect class="note" x="1250" y="865" width="254" height="68" rx="12"/><text class="t-small" x="1266" y="895">Новое делегирование</text><text class="t-small" x="1266" y="917">отменяет незаконченное</text></svg>
<figcaption>Пример — напоминание. Поиск, память и агенты идут тем же путём, только шаги 8–10 исполняет само ядро, а не телефон.</figcaption></figure>
